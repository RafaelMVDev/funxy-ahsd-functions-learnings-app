spring.application.name=login-api

# Configuração do Banco H2
spring.datasource.url=jdbc:h2:mem:appdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console visual do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Faz o Hibernate/JPA criar e atualizar as tabelas do banco automaticamente
spring.jpa.hibernate.ddl-auto=update