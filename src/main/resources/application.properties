# Configurações do H2 Database
spring.datasource.url=jdbc:h2:mem:auladb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilita o console do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicialização das tabelas pelo SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:modelo_fisico.sql
spring.jpa.defer-datasource-initialization=false

