#H2 em memória: os dados são recriados ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:mem:auladb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate valida as tabelas criadas pelo script SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Executa os scripts ao iniciar.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Primeiro: criação das tabelas.
spring.sql.init.schema-locations=classpath:modelo_fisico.sql

# Depois: inserts, na ordem abaixo.
spring.sql.init.data-locations=\
classpath:insert_atividades_trilhas.sql,\
classpath:insert_conquistas.sql,\
classpath:insert_itens.sql,\
classpath:insert_usuarios.sql

# Interrompe a inicialização se algum comando SQL falhar.
spring.sql.init.continue-on-error=false

