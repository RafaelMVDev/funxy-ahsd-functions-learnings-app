<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Alunos</title>
    <!-- Bootstrap para deixar a página com visual de sistema -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Cadastro de Alunos</h2>

    <!-- Formulário de Cadastro -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/adicionar}" th:object="${novoAluno}" method="post" class="row g-3">
                <div class="col-md-5">
                    <label for="nome" class="form-label">Nome do Aluno</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required placeholder="Ex: João da Silva">
                </div>
                <div class="col-md-5">
                    <label for="prontuario" class="form-label">Prontuário</label>
                    <input type="text" id="prontuario" th:field="*{prontuario}" class="form-control" required placeholder="Ex: SP123456">
                </div>

                <div class="col-md-5">
                    <label for="curso" class="form-label">Curso</label>
                    <input type="text" id="curso" th:field="*{curso}" class="form-control" required placeholder="Ex: DS">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Alunos -->
    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Prontuário</th>
                    <th>Ações</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.id}">1</td>
                    <td th:text="${aluno.nome}">Nome</td>
                    <td th:text="${aluno.prontuario}">Prontuário</td>
                    <td>
                        <a th:href="@{/editar/{id}(id=${aluno.id})}" class="btn btn-primary btn-sm">Editar</a>
                    </td>
                    <td>
                        <a th:href="@{/deletar/{id}(id=${aluno.id})}" class="btn btn-danger btn-sm">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(alunos)}">
                    <td colspan="4" class="text-center">Nenhum aluno cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
