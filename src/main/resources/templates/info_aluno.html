<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dados do Aluno</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Informações do Aluno</h3>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label class="form-label fw-bold">ID</label>
        <p class="form-control-plaintext" th:text="${aluno.id}">1</p>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Nome</label>
        <p class="form-control-plaintext" th:text="${aluno.nome}">João da Silva</p>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Prontuário</label>
        <p class="form-control-plaintext" th:text="${aluno.prontuario}">SP123456</p>
      </div>

      <a th:href="@{/}" class="btn btn-secondary">
        Voltar
      </a>

    </div>
  </div>

</div>

</body>
</html>
